services:
  app:
    build:
      # 从项目目录执行 docker compose 时，当前目录就是源码目录
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env
    volumes:
      - assets_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacanvas -d novacanvas"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
  assets_data:
